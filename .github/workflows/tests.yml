name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-reference.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q --junitxml=results/ci-tests.xml
      - run: python tests/reference_compare/compare.py --seeds 10 --queries 100 --output results/ci-reference-comparison.json
      - run: python -m fortune --random 100 --seed 2026 --delaunay --output results/ci.png --csv results/ci.csv --json results/ci.json
